plugins {
	id 'fabric-loom' version '1.16.3'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup("maven.modrinth")
		}
	}
	maven { url 'https://maven.terraformersmc.com/releases/' }
	maven {
		url 'https://maven.fallenbreath.me/releases'
		content { includeGroupAndSubgroups("me.fallenbreath") }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.mappings_version}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	// malilib requires some Fabric API modules at runtime (used for running the client in the dev environment)
	modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// malilib's mixin config plugin needs this; the malilib jar nests it, but that isn't picked up in the dev environment
	runtimeOnly "me.fallenbreath:conditional-mixin-fabric:${project.conditionalmixin_version}"
	implementation "com.google.code.findbugs:jsr305:3.0.2"

	modImplementation("maven.modrinth:malilib:${project.malilib_version}") { transitive = false }


	// Fabric API. This is technically optional, but you probably want it anyway.
	//modCompile "net.fabricmc.fabric-api:fabric-api:" + project.fabric_version

	modCompileOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") { transitive = false }
}

group = project.group + "." + project.mod_id
base.archivesName = project.mod_file_name + '-' + project.minecraft_version_out
version = project.mod_version

if (version.endsWith('-dev')) {
	version += "." + new Date().format('yyyyMMdd.HHmmss')
}

processResources {
	// Exclude the GIMP image files
	exclude '**/*.xcf'
	exclude '**/xcf'

	// this will ensure that this task is redone when the versions change.
	//inputs.property "minecraft_version", project.project.minecraft_version

	inputs.property "mod_version", project.mod_version

	filesMatching("fabric.mod.json") {
		expand "mod_version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "1000"]

	// Minecraft 1.20.5+ uses Java 21.
	it.options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = true
	//reproducibleFileOrder = true
}

loom {
	mixin {
		useLegacyMixinAp = true
	}
}
